name: Reconstruct M04 notebooks

on:
  push:
    paths:
      - '.m04-raw/**'
      - '.github/workflows/reconstruct-m04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct notebooks
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .m04-raw/P05.00 ]; then
            echo 'Raw payload already consumed; nothing to do.'
            exit 0
          fi

          mkdir -p modulo-04-ia-generativa/P05-rag-confiable
          mkdir -p modulo-04-ia-generativa/P06-agentes-confiables

          cat \
            .m04-raw/P05.00 \
            .m04-raw/P05.01 \
            .m04-raw/P05.02 \
            .m04-raw/P05.03 \
            > modulo-04-ia-generativa/P05-rag-confiable/P05_Velora_RAG_Confiable.ipynb

          cat \
            .m04-raw/P06.00 \
            .m04-raw/P06.01 \
            .m04-raw/P06.02 \
            .m04-raw/P06.03 \
            .m04-raw/P06.04 \
            .m04-raw/P06.05 \
            .m04-raw/P06.06 \
            .m04-raw/P06.07 \
            > modulo-04-ia-generativa/P06-agentes-confiables/P06_Velora_Agentes_Bedrock_Mantle.ipynb

          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              Path('modulo-04-ia-generativa/P05-rag-confiable/P05_Velora_RAG_Confiable.ipynb'): 35,
              Path('modulo-04-ia-generativa/P06-agentes-confiables/P06_Velora_Agentes_Bedrock_Mantle.ipynb'): 47,
          }

          for path, expected_cells in expected.items():
              notebook = json.loads(path.read_text(encoding='utf-8'))
              actual_cells = len(notebook['cells'])
              if actual_cells != expected_cells:
                  raise RuntimeError(
                      f'{path}: expected {expected_cells} cells, got {actual_cells}'
                  )
              print('Valid notebook:', path, 'cells=', actual_cells)
          PY

          rm -rf .m04-upload .m04-raw

      - name: Commit reconstructed notebooks
        shell: bash
        run: |
          if [ ! -f modulo-04-ia-generativa/P05-rag-confiable/P05_Velora_RAG_Confiable.ipynb ]; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi

          git commit -m 'Add M04 RAG and agent notebooks'
          git push
